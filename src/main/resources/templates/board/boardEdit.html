<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>게시글 수정</title>
    <meta charset="UTF-8" />
    <!--bootstrap-->
    <link rel="stylesheet" th:href="@{/css/bootstrap/bootstrap.min.css}">

    <!--toastui-->
    <link rel="stylesheet" th:href="@{/css/toastui/toastui-editor.min.css}">
    <script th:src="@{/js/lib/toastui-editor-all.min.js}"></script>
    <script th:src="@{/js/toastuieditorclear.js}"></script>
</head>
<body class="bg-light">
<!-- 네비게이션 바 -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">📘 Iptable Command Code</a>

            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/sign/signIn}">로그인</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/sign/signUp}">회원가입</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/board/boardList}">게시판</a>
                    </li>
                </ul>
            </div>

    </div>
</nav>
<div class="container mt-5">
    <h2 class="mb-4 text-center">✏️ 게시글 수정</h2>
    <form th:action="@{/board/{id}/edit(id=${post.boardSq})}" method="post" id="editForm">
        <div class="mb-3">
            <input type="text" name="title" class="form-control" th:value="${post.title}" required>
        </div>

        <div id="editor"></div>
        <input type="hidden" name="content" id="hiddenContent" />

        <div class="mt-4 d-flex justify-content-end">
            <a th:href="@{/board/{id}(id=${post.boardSq})}" class="btn btn-secondary me-2">취소</a>
            <button type="submit" class="btn btn-primary">수정 완료</button>
        </div>
    </form>
</div>
</body>
</html>

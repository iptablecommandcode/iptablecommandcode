<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('포스트 수정')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">
<div class="write-wrap">
    <h2 style="font-weight:800;margin-bottom:24px;">✏ 포스트 수정</h2>
    <form th:action="@{/board/boardUpdate}" method="post" id="editForm">
        <div class="mb-3">
            <select name="categorySq" class="form-select" style="max-width:200px;">
                <option value="">카테고리 선택</option>
                <option th:each="cat : ${categories}"
                        th:value="${cat.categorySq}"
                        th:text="${cat.categoryName}"
                        th:selected="${board.categorySq == cat.categorySq}"></option>
            </select>
        </div>
        <input type="text" name="title" class="form-control write-title" th:value="${board.title}" required>
        <div id="editor"></div>
        <textarea id="hiddenContent" name="content" style="display:none;" th:text="${board.content}"></textarea>
        <div class="mt-3">
            <input type="text" name="tagNames" class="form-control"
                   th:value="${board.tagNames}"
                   placeholder="태그 입력 (쉼표로 구분)"
                   style="border-radius:8px;font-size:.9rem;">
            <div style="margin-top:8px;" th:if="${allTags != null}">
                <span style="font-size:.78rem;color:#aaa;">빠른 태그: </span>
                <a th:each="tag : ${allTags}" href="#"
                   th:text="'#' + ${tag.tagName}"
                   onclick="addTag(this.textContent.substring(1));return false;"
                   style="font-size:.78rem;color:#0d6efd;margin-right:6px;text-decoration:none;"></a>
            </div>
        </div>
        <div class="mt-3">
            <input type="text" name="thumbnailUrl" class="form-control"
                   th:value="${board.thumbnailUrl}"
                   placeholder="썸네일 이미지 URL"
                   style="border-radius:8px;font-size:.9rem;">
        </div>
        <input type="hidden" name="boardSq" th:value="${board.boardSq}">
        <div class="mt-4 d-flex justify-content-end gap-2">
            <a th:href="@{/board/boardDetail(boardSq=${board.boardSq})}" style="background:#f0f0f0;color:#555;border-radius:8px;padding:9px 20px;text-decoration:none;">취소</a>
            <button type="submit" style="background:#0d6efd;color:#fff;border:none;border-radius:8px;padding:9px 24px;font-weight:600;">수정 완료</button>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
<script th:src="@{/js/quilleditor.js}"></script>
<script>
function addTag(tagName) {
    var input = document.querySelector('input[name="tagNames"]');
    var tags  = input.value.trim() ? input.value.trim().split(',').map(t=>t.trim()) : [];
    if (!tags.includes(tagName)) { tags.push(tagName); input.value = tags.join(','); }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>글쓰기</title>
    <meta charset="UTF-8">
    <!--bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--<link rel="stylesheet" th:href="@{/css/bootstrap/bootstrap.min.css}">-->

    <!--toastui-->
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css" />
    <!--<link rel="stylesheet" th:href="@{/css/toastui/toastui-editor.min.css}">-->
    <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"/>
    <!--<script th:src="@{}/js/toastui-editor-all.min.js"/>-->

</head>
<body class="bg-light">

<!-- 네비게이션 바 -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">📘 Iptable Command Code</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/sign/signIn}">로그인</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/sign/signUp}">회원가입</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/board/boardList}">게시판</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- 본문 -->
<div class="container mt-5">
    <h2 class="mb-4 text-center">✍ 글쓰기</h2>

    <form th:action="@{/board/new}" method="post" id="postForm">
        <div class="mb-3">
            <input type="text" name="title" class="form-control" placeholder="제목을 입력하세요" required>
        </div>

        <!-- Toast UI Editor 영역 -->
        <div id="editor"></div>
        <input type="hidden" name="content" id="hiddenContent">

        <div class="mt-4 d-flex justify-content-end">
            <a th:href="@{/board}" class="btn btn-secondary me-2">취소</a>
            <button type="submit" class="btn btn-primary">작성 완료</button>
        </div>
    </form>
</div>

<!-- Toast UI Editor 초기화 스크립트 -->
<script>
    const editor = new toastui.Editor({
        el: document.querySelector('#editor'),
        height: '500px',
        initialEditType: 'wysiwyg',
        previewStyle: 'vertical',
        hooks: {
            addImageBlobHook: async (blob, callback) => {
                const formData = new FormData();
                formData.append('image', blob);
                const res = await fetch('/upload-image', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                callback(data.url, 'image');
            }
        }
    });

    document.getElementById('postForm').addEventListener('submit', function() {
        document.getElementById('hiddenContent').value = editor.getHTML();
    });
</script>
</body>
</html>

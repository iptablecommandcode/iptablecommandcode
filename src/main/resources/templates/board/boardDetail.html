<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>게시글 상세</title>
    <meta charset="UTF-8">
    <!--<link rel="stylesheet" th:href="@{/css/bootstrap/bootstrap.min.css}">-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- 네비게이션 바 -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">📘 Iptable Command Code</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/sign/signIn}">로그인</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/sign/signUp}">회원가입</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/board/boardList}">게시판</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!--중간-->
<div class="container mt-5">
    <h2 class="mb-4 text-center">📄 게시글 상세</h2>

    <div class="card shadow-sm">
        <div class="card-body">
            <h4 class="card-title" th:text="${post.title}">제목</h4>
            <p class="card-subtitle mb-2 text-muted">
                작성자: <span th:text="${post.author}">홍길동</span> |
                작성일: <span th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">2025-04-22</span>
            </p>
            <hr>
            <p class="card-text" th:text="${post.content}">게시글 내용</p>

            <div class="mt-4">
                <a th:href="@{/board}" class="btn btn-outline-secondary">목록으로</a>

                <a th:href="@{'/board/edit/' + ${post.id}}" class="btn btn-warning me-1">수정</a>
                <form th:action="@{'/board/delete/' + ${post.id}}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-danger" onclick="return confirm('정말 삭제할까요?')">삭제</button>
                </form>
            </div>
        </div>
    </div>

    <hr class="mt-5" />
    <h5>💬 댓글</h5>

    <form th:action="@{/board/{id}/comment(id=${post.boardSq})}" method="post" class="mt-4">
        <div class="mb-3">
            <textarea name="content" class="form-control" rows="3" placeholder="댓글을 작성하세요." required></textarea>
        </div>
        <div class="d-flex justify-content-end">
            <button type="submit" class="btn btn-primary">댓글 작성</button>
        </div>
    </form>

    <ul class="list-group">
        <li class="list-group-item" th:each="comment : ${post.comments}">
            <strong th:text="${comment.author}">작성자</strong>
            <small class="text-muted" th:text="${#temporals.format(comment.createdAt, 'yyyy-MM-dd HH:mm')}"></small>
            <p th:text="${comment.content}" class="mb-1"></p>
        </li>
    </ul>
</div>
</body>
</html>

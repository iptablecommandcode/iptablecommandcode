<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${boardDetail.title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div class="blog-wrap">
<main class="blog-main">

    <!-- 포스트 헤더 -->
    <div class="post-header">
        <div style="font-size:.8rem;color:#0d6efd;font-weight:600;margin-bottom:8px;" th:text="${boardDetail.categoryName ?: '미분류'}"></div>
        <h1 th:text="${boardDetail.title}"></h1>
        <div class="post-meta">
            <span th:text="${boardDetail.username}"></span> ·
            <span th:text="${#temporals.format(boardDetail.createDate,'yyyy년 MM월 dd일')}"></span> ·
            <span>조회 <span th:text="${boardDetail.viewCount}"></span></span>
        </div>
        <!-- 태그 -->
        <div class="post-tags mt-2" th:if="${not #lists.isEmpty(boardDetail.tags)}">
            <a th:each="tag : ${boardDetail.tags}"
               th:href="@{/board/boardList(tagSq=${tag.tagSq})}"
               th:text="'#' + ${tag.tagName}"></a>
        </div>
    </div>

    <!-- 본문 -->
    <div class="post-content ql-editor-view" th:utext="${boardDetail.content}"></div>

    <!-- 작성자 액션 -->
    <div th:if="${session.loginUser != null and session.loginUser.userId == boardDetail.userId}"
         style="display:flex;gap:8px;justify-content:flex-end;margin-bottom:20px;">
        <a th:href="@{/board/boardEdit(boardSq=${boardDetail.boardSq})}"
           style="background:#f3f3f3;color:#555;border-radius:8px;padding:7px 16px;text-decoration:none;font-size:.88rem;">수정</a>
        <form th:action="@{/board/boardDelete}" method="post" style="display:inline;">
            <input type="hidden" name="boardSq" th:value="${boardDetail.boardSq}">
            <button type="submit" onclick="return confirm('정말 삭제할까요?')"
                    style="background:#ff4757;color:#fff;border:none;border-radius:8px;padding:7px 16px;font-size:.88rem;">삭제</button>
        </form>
    </div>

    <!-- 댓글 -->
    <div class="comment-wrap">
        <div style="font-weight:700;font-size:1rem;margin-bottom:16px;">💬 댓글 <span th:text="${#lists.size(commentDTOList)}" style="color:#0d6efd;"></span></div>

        <!-- 댓글 작성 -->
        <form th:if="${session.loginUser != null}" th:action="@{/comment/boardComment}" method="post" class="comment-form mb-4">
            <textarea name="content" class="form-control mb-2" rows="3" placeholder="댓글을 작성하세요." required></textarea>
            <input type="hidden" name="boardSq"          th:value="${boardDetail.boardSq}">
            <input type="hidden" name="userId"           th:value="${session.loginUser.userId}">
            <input type="hidden" name="username"         th:value="${session.loginUser.username}">
            <input type="hidden" name="parentCommentSq" value="">
            <div class="text-end"><button type="submit" class="btn-comment">댓글 작성</button></div>
        </form>
        <div th:if="${session.loginUser == null}" style="text-align:center;padding:20px;color:#aaa;font-size:.9rem;">
            <a th:href="@{/sign/signIn}" style="color:#0d6efd;">로그인</a> 후 댓글을 작성할 수 있습니다.
        </div>

        <!-- 댓글 목록 -->
        <div th:each="comment : ${commentDTOList}" class="comment-item">
            <div>
                <span class="comment-author" th:text="${comment.username}"></span>
                <span class="comment-date" th:text="${#temporals.format(comment.createDate,'yyyy.MM.dd HH:mm')}"></span>
                <form th:if="${session.loginUser != null and session.loginUser.userId == comment.userId}"
                      th:action="@{'/comment/' + ${comment.commentSq} + '/delete'}" method="post" style="display:inline;float:right;">
                    <input type="hidden" name="boardSq" th:value="${boardDetail.boardSq}">
                    <button type="submit" style="background:none;border:none;color:#ccc;font-size:.78rem;cursor:pointer;">삭제</button>
                </form>
            </div>
            <div class="comment-text" th:text="${comment.content}"></div>
        </div>

        <div th:if="${#lists.isEmpty(commentDTOList)}" style="text-align:center;padding:30px;color:#ccc;font-size:.9rem;">첫 번째 댓글을 작성해보세요!</div>
    </div>
</main>
<aside th:replace="~{fragments/layout :: sidebar}"></aside>
</div>
</body>
</html>

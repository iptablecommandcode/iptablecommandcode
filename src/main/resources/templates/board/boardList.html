<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('포스트 목록')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div class="blog-wrap">
    <main class="blog-main">
        <!-- 필터 탭 -->
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;align-items:center;">
            <a th:href="@{/board/boardList}"
               th:classappend="${categorySq == null and tagSq == null} ? 'active' : ''"
               style="padding:5px 14px;border-radius:20px;font-size:.85rem;text-decoration:none;"
               th:style="${categorySq == null and tagSq == null} ? 'background:#f0f0f0;color:#555;padding:5px 14px;border-radius:20px;font-size:.85rem;text-decoration:none;' : 'background:#f0f0f0;color:#555;'">전체</a>
            <th:block th:each="cat : ${categories}">
                <a th:href="@{/board/boardList(categorySq=${cat.categorySq})}"
                   th:text="${cat.categoryName + (cat.commonYn == 'Y' ? ' · 공통' : ' · 개인')}"
                   th:style="${categorySq != null and categorySq == cat.categorySq} ? 'background:#0d6efd;color:#fff;padding:5px 14px;border-radius:20px;font-size:.85rem;text-decoration:none;' : 'background:#f0f0f0;color:#555;padding:5px 14px;border-radius:20px;font-size:.85rem;text-decoration:none;'"></a>
            </th:block>
        </div>

        <!-- 태그 필터 표시 -->
        <div th:if="${tagSq != null}" style="margin-bottom:16px;font-size:.9rem;color:#0d6efd;">
            🏷 태그 필터 적용 중 — <a th:href="@{/board/boardList}" style="color:#aaa;font-size:.82rem;">해제</a>
        </div>

        <!-- 글쓰기 버튼 -->
        <div th:if="${session.loginUser != null}" class="text-end mb-3">
            <a th:href="@{/board/boardWrite}" class="btn-write" style="background:#0d6efd;color:#fff;border:none;border-radius:20px;padding:7px 18px;font-size:.85rem;text-decoration:none;">✏ 글쓰기</a>
        </div>

        <!-- 포스트 카드 목록 -->
        <th:block th:each="board : ${boards}">
            <div class="post-card">
                <div class="post-card-thumb-placeholder" th:if="${board.thumbnailUrl == null}">📄</div>
                <img class="post-card-thumb" th:if="${board.thumbnailUrl != null}" th:src="${board.thumbnailUrl}" alt="">
                <div class="post-card-body">
                    <div class="post-card-cat" th:text="${board.categoryName ?: '미분류'}"></div>
                    <a class="post-card-title" th:href="@{/board/boardDetail(boardSq=${board.boardSq})}">
                        <span th:if="${board.noticeYn == 'Y'}" class="badge-notice">공지</span>
                        <span th:text="${board.title}"></span>
                    </a>
                    <div class="post-card-summary" th:text="${board.summary}"></div>
                    <div class="post-card-meta">
                        <span th:text="${board.username}"></span>
                        <span th:text="${#temporals.format(board.createDate,'yyyy.MM.dd')}"></span>
                        <span>👁 <span th:text="${board.viewCount}"></span></span>
                    </div>
                </div>
            </div>
        </th:block>
        <div th:if="${#lists.isEmpty(boards)}" style="text-align:center;padding:80px;color:#aaa;background:#fff;border-radius:10px;">아직 포스트가 없습니다.</div>
    </main>
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
</div>
</body>
</html>

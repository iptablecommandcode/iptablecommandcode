<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>글쓰기</title>
    <meta charset="UTF-8">
    <!-- Bootstrap -->
    <link rel="stylesheet" th:href="@{/css/bootstrap/bootstrap.min.css}">
    <!-- Quill CDN -->
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
    <!-- Quill 초기화 -->
    <script th:src="@{/js/quilleditor.js}" defer></script>
    <style>
        #editor { height: 400px; background: #fff; }
        .ql-toolbar { border-radius: 0.375rem 0.375rem 0 0; }
        .ql-container { border-radius: 0 0 0.375rem 0.375rem; font-size: 1rem; }
    </style>
</head>
<body class="bg-light">

<!-- 네비게이션 바 -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">📘 Iptable Command Code</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item" th:if="${session.loginUser == null}">
                    <a class="nav-link" th:href="@{/sign/signIn}">로그인</a>
                </li>
                <li class="nav-item" th:if="${session.loginUser == null}">
                    <a class="nav-link" th:href="@{/sign/signUp}">회원가입</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/board/boardList}">게시판</a>
                </li>
                <li class="nav-item" th:if="${session.loginUser != null}">
                    <span class="nav-link" th:text="${session.loginUser.username} + ' 님 로그인 중입니다.'">님 로그인 중 입니다.</span>
                </li>
                <li class="nav-item" th:if="${session.loginUser != null}">
                    <a class="nav-link" th:href="@{/sign/signOut}">로그 아웃</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- 본문 -->
<div class="container mt-5">
    <h2 class="mb-4 text-center">✍ 글쓰기</h2>

    <form th:action="@{/board/boardWrite}" method="post" id="boardForm">
        <div class="mb-3">
            <input type="text" name="title" class="form-control" placeholder="제목을 입력하세요" required>
        </div>

        <!-- Quill 에디터 영역 -->
        <div id="editor"></div>
        <!-- 폼 submit 시 Quill HTML이 여기에 채워짐 -->
        <textarea id="hiddenContent" name="content" style="display:none;"></textarea>

        <div class="mt-4 d-flex justify-content-end">
            <a th:href="@{/board/boardList}" class="btn btn-secondary me-2">취소</a>
            <button type="submit" class="btn btn-primary">작성 완료</button>
        </div>
    </form>
</div>
</body>
</html>

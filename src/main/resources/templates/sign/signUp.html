<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('회원가입')}"></head>
<body style="background:#f9f9f9; min-height:100vh; display:flex; flex-direction:column;">
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div style="flex:1; display:flex; align-items:center; justify-content:center; padding:40px 16px;">
    <div style="max-width:480px; width:100%; background:#fff; border-radius:16px; padding:48px 40px; box-shadow:0 8px 40px rgba(0,0,0,.08);">
        <!-- 로고 & 타이틀 -->
        <div style="text-align:center; margin-bottom:32px;">
            <div style="display:inline-flex; align-items:center; justify-content:center; width:56px; height:56px; background:linear-gradient(135deg,#0d6efd,#0a58ca); border-radius:14px; margin-bottom:16px;">
                <span style="font-size:1.5rem; color:#fff; font-weight:800;">iT</span>
            </div>
            <h2 style="font-size:1.5rem; font-weight:800; color:#111; margin:0 0 6px;">회원가입</h2>
            <p style="font-size:.88rem; color:#999; margin:0;">iptablecommandcode 계정을 만드세요</p>
        </div>

        <!-- 에러 메시지 -->
        <div th:if="${error}" style="background:#fff5f5; border:1px solid #fed7d7; border-radius:10px; padding:12px 16px; margin-bottom:20px; display:flex; align-items:center; gap:8px;">
            <span style="color:#e53e3e; font-size:1rem;">&#9888;</span>
            <span th:text="${error}" style="font-size:.85rem; color:#c53030;"></span>
        </div>

        <!-- 회원가입 폼 -->
        <form th:action="@{/sign/register}" method="post" id="registerForm">

            <!-- 아이디 + 중복 체크 -->
            <div style="margin-bottom:18px;">
                <label for="username" style="font-size:.82rem; font-weight:600; color:#555; margin-bottom:6px; display:block;">아이디</label>
                <div style="display:flex; gap:8px;">
                    <input type="text" id="username" name="username"
                           class="form-control signup-input"
                           placeholder="아이디를 입력하세요"
                           autocomplete="off" required
                           style="flex:1; border-radius:10px; border:1.5px solid #e2e8f0; padding:12px 16px; font-size:.92rem; transition:all .2s;" />
                    <button type="button" id="checkUsernameBtn"
                            style="flex-shrink:0; background:#f1f5f9; border:1.5px solid #e2e8f0; border-radius:10px; padding:0 16px; font-size:.82rem; font-weight:600; color:#555; cursor:pointer; transition:all .2s; white-space:nowrap;">
                        중복 확인
                    </button>
                </div>
                <div id="usernameMsg" style="font-size:.82rem; margin-top:6px; min-height:1.2rem;"></div>
            </div>

            <!-- 비밀번호 -->
            <div style="margin-bottom:18px;">
                <label for="password" style="font-size:.82rem; font-weight:600; color:#555; margin-bottom:6px; display:block;">비밀번호</label>
                <input type="password" id="password" name="password"
                       class="form-control signup-input"
                       placeholder="비밀번호를 입력하세요"
                       required
                       style="border-radius:10px; border:1.5px solid #e2e8f0; padding:12px 16px; font-size:.92rem; transition:all .2s;" />
            </div>

            <!-- 비밀번호 확인 -->
            <div style="margin-bottom:18px;">
                <label for="confirmPassword" style="font-size:.82rem; font-weight:600; color:#555; margin-bottom:6px; display:block;">비밀번호 확인</label>
                <input type="password" id="confirmPassword" name="confirmPassword"
                       class="form-control signup-input"
                       placeholder="비밀번호를 다시 입력하세요"
                       required
                       style="border-radius:10px; border:1.5px solid #e2e8f0; padding:12px 16px; font-size:.92rem; transition:all .2s;" />
                <div id="passwordMsg" style="font-size:.82rem; margin-top:6px; min-height:1.2rem;"></div>
            </div>

            <!-- 이메일 -->
            <div style="margin-bottom:28px;">
                <label style="font-size:.82rem; font-weight:600; color:#555; margin-bottom:6px; display:block;">이메일</label>
                <div style="display:flex; align-items:center; gap:8px;">
                    <input type="text" id="emailLocal"
                           class="form-control signup-input"
                           placeholder="이메일 아이디" autocomplete="off"
                           style="flex:1; min-width:0; border-radius:10px; border:1.5px solid #e2e8f0; padding:12px 16px; font-size:.92rem; transition:all .2s;" />
                    <span style="color:#94a3b8; font-weight:600; flex-shrink:0; font-size:.95rem;">@</span>
                    <select id="emailDomain"
                            style="flex:1; min-width:0; border-radius:10px; border:1.5px solid #e2e8f0; padding:12px 14px; font-size:.92rem; background:#fff; color:#333; cursor:pointer; transition:all .2s; appearance:auto;">
                        <option value="">불러오는 중...</option>
                    </select>
                </div>
                <input type="text" id="emailDomainDirect"
                       class="form-control signup-input"
                       placeholder="도메인을 직접 입력하세요 (예: company.co.kr)"
                       style="display:none; margin-top:10px; border-radius:10px; border:1.5px solid #e2e8f0; padding:12px 16px; font-size:.92rem; transition:all .2s;" />
                <input type="hidden" id="email" name="email" />
            </div>

            <button type="submit"
                    style="background:linear-gradient(135deg,#0d6efd,#0a58ca); color:#fff; border:none; border-radius:10px; width:100%; padding:13px; font-weight:700; font-size:.95rem; cursor:pointer; transition:transform .15s, box-shadow .15s; box-shadow:0 4px 14px rgba(13,110,253,.3);"
                    class="btn-signup">
                가입하기
            </button>
        </form>

        <!-- 구분선 -->
        <div style="display:flex; align-items:center; margin:28px 0 24px;">
            <div style="flex:1; height:1px; background:#e2e8f0;"></div>
            <span style="padding:0 14px; font-size:.78rem; color:#aaa;">또는</span>
            <div style="flex:1; height:1px; background:#e2e8f0;"></div>
        </div>

        <!-- 로그인 링크 -->
        <div style="text-align:center;">
            <span style="font-size:.88rem; color:#999;">이미 계정이 있으신가요?</span>
            <a th:href="@{/sign/signIn}" style="font-size:.88rem; color:#0d6efd; font-weight:600; text-decoration:none; margin-left:4px;">
                로그인
            </a>
        </div>
    </div>
</div>

<style>
    .signup-input:focus,
    #emailDomain:focus {
        border-color: #0d6efd !important;
        box-shadow: 0 0 0 3px rgba(13,110,253,.12) !important;
        outline: none;
    }
    #checkUsernameBtn:hover {
        background: #e2e8f0;
        border-color: #cbd5e1;
        color: #333;
    }
    .btn-signup:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(13,110,253,.4) !important;
    }
    .btn-signup:active {
        transform: translateY(0);
    }
    #usernameMsg.available   { color: #198754; }
    #usernameMsg.unavailable { color: #dc3545; }
</style>

<script>
(function () {
    'use strict';

    /* ── 아이디 중복 체크 ── */
    var usernameChecked = false;

    document.getElementById('checkUsernameBtn').addEventListener('click', function () {
        var username = document.getElementById('username').value.trim();
        var msgEl    = document.getElementById('usernameMsg');
        if (!username) {
            msgEl.textContent = '아이디를 입력해주세요.';
            msgEl.className   = 'unavailable';
            return;
        }
        fetch('/sign/checkUsername?username=' + encodeURIComponent(username))
            .then(function (res) { return res.json(); })
            .then(function (data) {
                if (data.available) {
                    msgEl.textContent = '사용 가능한 아이디입니다.';
                    msgEl.className   = 'available';
                    usernameChecked   = true;
                } else {
                    msgEl.textContent = '이미 사용 중인 아이디입니다.';
                    msgEl.className   = 'unavailable';
                    usernameChecked   = false;
                }
            })
            .catch(function () {
                msgEl.textContent = '중복 확인 중 오류가 발생했습니다.';
                msgEl.className   = 'unavailable';
                usernameChecked   = false;
            });
    });

    document.getElementById('username').addEventListener('input', function () {
        usernameChecked = false;
        var msgEl = document.getElementById('usernameMsg');
        msgEl.textContent = '';
        msgEl.className   = '';
    });

    /* ── 비밀번호 확인 ── */
    document.getElementById('confirmPassword').addEventListener('input', function () {
        var pw    = document.getElementById('password').value;
        var msgEl = document.getElementById('passwordMsg');
        if (!this.value) {
            msgEl.textContent = '';
        } else if (pw === this.value) {
            msgEl.textContent  = '비밀번호가 일치합니다.';
            msgEl.style.color  = '#198754';
        } else {
            msgEl.textContent  = '비밀번호가 일치하지 않습니다.';
            msgEl.style.color  = '#dc3545';
        }
    });

    /* ── 이메일 도메인 목록 DB에서 로딩 ── */
    var domainSelect = document.getElementById('emailDomain');
    var domainDirect = document.getElementById('emailDomainDirect');

    fetch('/api/email-domain/list')
        .then(function (res) { return res.json(); })
        .then(function (data) {
            domainSelect.innerHTML = '';
            data.forEach(function (item) {
                var opt = document.createElement('option');
                opt.value       = item.domainName;
                opt.textContent = item.domainName;
                domainSelect.appendChild(opt);
            });
            var directOpt = document.createElement('option');
            directOpt.value       = 'direct';
            directOpt.textContent = '직접 입력';
            domainSelect.appendChild(directOpt);
        })
        .catch(function () {
            domainSelect.innerHTML =
                '<option value="naver.com">naver.com</option>' +
                '<option value="gmail.com">gmail.com</option>' +
                '<option value="daum.net">daum.net</option>' +
                '<option value="direct">직접 입력</option>';
        });

    domainSelect.addEventListener('change', function () {
        if (this.value === 'direct') {
            domainDirect.style.display = 'block';
            domainDirect.required      = true;
        } else {
            domainDirect.style.display = 'none';
            domainDirect.required      = false;
            domainDirect.value         = '';
        }
    });

    /* ── 폼 submit 처리 ── */
    document.getElementById('registerForm').addEventListener('submit', function (e) {
        if (!usernameChecked) {
            e.preventDefault();
            var msgEl = document.getElementById('usernameMsg');
            msgEl.textContent = '아이디 중복 확인을 해주세요.';
            msgEl.className   = 'unavailable';
            return;
        }
        var pw  = document.getElementById('password').value;
        var cpw = document.getElementById('confirmPassword').value;
        if (pw !== cpw) {
            e.preventDefault();
            var pMsg = document.getElementById('passwordMsg');
            pMsg.textContent = '비밀번호가 일치하지 않습니다.';
            pMsg.style.color = '#dc3545';
            return;
        }
        var local  = document.getElementById('emailLocal').value.trim();
        var domain = domainSelect.value === 'direct'
                     ? domainDirect.value.trim()
                     : domainSelect.value;
        if (local && domain) {
            document.getElementById('email').value = local + '@' + domain;
        }
    });
})();
</script>
</body>
</html>

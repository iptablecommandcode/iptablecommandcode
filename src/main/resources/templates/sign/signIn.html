<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('로그인')}"></head>
<body style="background:#f9f9f9; min-height:100vh; display:flex; flex-direction:column;">
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div style="flex:1; display:flex; align-items:center; justify-content:center; padding:40px 16px;">
    <div class="auth-card" style="max-width:440px; width:100%; margin:0 auto; background:#fff; border-radius:16px; padding:48px 40px; box-shadow:0 8px 40px rgba(0,0,0,.08);">
        <!-- 로고 & 타이틀 -->
        <div style="text-align:center; margin-bottom:36px;">
            <div style="display:inline-flex; align-items:center; justify-content:center; width:56px; height:56px; background:linear-gradient(135deg,#0d6efd,#0a58ca); border-radius:14px; margin-bottom:16px;">
                <span style="font-size:1.5rem; color:#fff; font-weight:800;">iT</span>
            </div>
            <h2 style="font-size:1.5rem; font-weight:800; color:#111; margin:0 0 6px;">로그인</h2>
            <p style="font-size:.88rem; color:#999; margin:0;">iptablecommandcode에 오신 것을 환영합니다</p>
        </div>

        <!-- 에러 메시지 -->
        <div th:if="${error}" style="background:#fff5f5; border:1px solid #fed7d7; border-radius:10px; padding:12px 16px; margin-bottom:20px; display:flex; align-items:center; gap:8px;">
            <span style="color:#e53e3e; font-size:1rem;">&#9888;</span>
            <span th:text="${error}" style="font-size:.85rem; color:#c53030;"></span>
        </div>

        <!-- 로그인 폼 -->
        <form th:action="@{/sign/signIn.do}" method="post">
            <div style="margin-bottom:20px;">
                <label class="form-label" style="font-size:.82rem; font-weight:600; color:#555; margin-bottom:6px; display:block;">아이디</label>
                <input type="text" name="username" class="form-control"
                       placeholder="아이디를 입력하세요"
                       required
                       style="border-radius:10px; border:1.5px solid #e2e8f0; padding:12px 16px; font-size:.92rem; transition:all .2s;">
            </div>
            <div style="margin-bottom:28px;">
                <label class="form-label" style="font-size:.82rem; font-weight:600; color:#555; margin-bottom:6px; display:block;">비밀번호</label>
                <input type="password" name="password" class="form-control"
                       placeholder="비밀번호를 입력하세요"
                       required
                       style="border-radius:10px; border:1.5px solid #e2e8f0; padding:12px 16px; font-size:.92rem; transition:all .2s;">
            </div>
            <button type="submit" class="btn-brand"
                    style="background:linear-gradient(135deg,#0d6efd,#0a58ca); color:#fff; border:none; border-radius:10px; width:100%; padding:13px; font-weight:700; font-size:.95rem; cursor:pointer; transition:transform .15s, box-shadow .15s; box-shadow:0 4px 14px rgba(13,110,253,.3);">
                로그인
            </button>
        </form>

        <!-- 구분선 -->
        <div style="display:flex; align-items:center; margin:28px 0 24px;">
            <div style="flex:1; height:1px; background:#e2e8f0;"></div>
            <span style="padding:0 14px; font-size:.78rem; color:#aaa;">또는</span>
            <div style="flex:1; height:1px; background:#e2e8f0;"></div>
        </div>

        <!-- 회원가입 링크 -->
        <div style="text-align:center;">
            <span style="font-size:.88rem; color:#999;">계정이 없으신가요?</span>
            <a th:href="@{/sign/signUp}" style="font-size:.88rem; color:#0d6efd; font-weight:600; text-decoration:none; margin-left:4px;">
                회원가입
            </a>
        </div>
    </div>
</div>

<style>
    .auth-card input.form-control:focus {
        border-color: #0d6efd !important;
        box-shadow: 0 0 0 3px rgba(13,110,253,.12) !important;
        outline: none;
    }
    .btn-brand:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(13,110,253,.4) !important;
    }
    .btn-brand:active {
        transform: translateY(0);
    }
</style>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sign In</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap/bootstrap.min.css}">
</head>
<body class="bg-light">

<!--메뉴바-->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">📘 Iptable Command Code</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/sign/signIn}">로그인</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/sign/signUp}">회원가입</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/board/boardList}">게시판</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!--중간-->
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body">
                    <h3 class="card-title text-center mb-4">로그인</h3>
                    <form th:action="@{/sign/signIn.do}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">아이디</label>
                            <input type="text" id="username" name="username" class="form-control" required/>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">비밀번호</label>
                            <input type="password" id="password" name="password" class="form-control" required/>
                        </div>
                        <div class="d-flex justify-content-between">
                            <button type="submit" class="btn btn-primary w-50 me-2">로그인</button>
                            <a th:href="@{/sign/signUp}" class="btn btn-outline-secondary w-50">회원가입</a>
                        </div>
                    </form>
                    <div th:if="${error}" class="alert alert-danger mt-3" th:text="${error}"></div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>

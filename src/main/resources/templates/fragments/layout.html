<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:thymeleaf="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + 'iptablecommandcode | ' + ${@environment.getProperty('project.level')}">iptablecommandcode</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap/bootstrap.min.css}">
    <style>
        :root { --brand: #0d6efd; --brand-dark: #0a58ca; --sidebar-w: 260px; }
        body { font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; background: #f9f9f9; color: #333; }

        /* ── 네비 ── */
        .blog-nav { background: #fff; border-bottom: 1px solid #eee; position: sticky; top:0; z-index:100; }
        .blog-nav .brand { font-size: 1.25rem; font-weight: 700; color: var(--brand); text-decoration: none; }
        .blog-nav .nav-link { color: #555; font-size: .9rem; }
        .blog-nav .nav-link:hover { color: var(--brand); }
        .blog-nav .btn-write { background: var(--brand); color: #fff; border: none; border-radius: 20px; padding: 5px 16px; font-size: .85rem; }
        .blog-nav .btn-write:hover { background: var(--brand-dark); color: #fff; }

        /* ── 레이아웃 ── */
        .blog-wrap { display: flex; max-width: 1100px; margin: 0 auto; padding: 28px 16px; gap: 28px; }
        .blog-main  { flex: 1; min-width: 0; }
        .blog-side  { width: var(--sidebar-w); flex-shrink: 0; }

        /* ── 사이드바 ── */
        .side-section { background: #fff; border-radius: 10px; padding: 18px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
        .side-title   { font-size: .78rem; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }
        .side-cat-item { display: flex; justify-content: space-between; padding: 5px 0; font-size: .88rem; color: #444; text-decoration: none; border-bottom: 1px solid #f3f3f3; }
        .side-cat-item:hover { color: var(--brand); }
        .side-cat-item .cnt  { font-size: .78rem; color: #aaa; }
        .tag-cloud a { display: inline-block; background: #f3f3f3; color: #555; font-size: .78rem; border-radius: 20px; padding: 3px 10px; margin: 3px 2px; text-decoration: none; }
        .tag-cloud a:hover { background: var(--brand); color: #fff; }

        /* ── 카드 ── */
        .post-card { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.07); margin-bottom: 20px; overflow: hidden; display: flex; transition: box-shadow .2s; }
        .post-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.12); }
        .post-card-thumb { width: 200px; flex-shrink: 0; background: #eee; object-fit: cover; }
        .post-card-thumb-placeholder { width: 200px; flex-shrink: 0; background: linear-gradient(135deg,#f3f3f3 0%,#e8e8e8 100%); display: flex; align-items: center; justify-content: center; color: #ccc; font-size: 2rem; }
        .post-card-body  { padding: 20px; flex: 1; min-width: 0; }
        .post-card-cat   { font-size: .75rem; color: var(--brand); font-weight: 600; text-transform: uppercase; margin-bottom: 6px; }
        .post-card-title { font-size: 1.1rem; font-weight: 700; color: #222; text-decoration: none; display: block; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .post-card-title:hover { color: var(--brand); }
        .post-card-summary { font-size: .88rem; color: #666; line-height: 1.6; margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .post-card-meta  { font-size: .78rem; color: #aaa; }
        .post-card-meta span { margin-right: 10px; }
        .badge-notice    { background: #ff4757; color: #fff; font-size: .7rem; padding: 2px 7px; border-radius: 4px; margin-right: 6px; }
        .post-tags a     { font-size: .75rem; color: #888; text-decoration: none; margin-right: 6px; }
        .post-tags a:hover { color: var(--brand); }

        /* ── 상세 ── */
        .post-header     { background: #fff; border-radius: 10px; padding: 32px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
        .post-header h1  { font-size: 1.8rem; font-weight: 800; color: #111; line-height: 1.4; }
        .post-meta       { font-size: .85rem; color: #aaa; margin: 10px 0 0; }
        .post-content    { background: #fff; border-radius: 10px; padding: 32px; box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: 20px; font-size: 1rem; line-height: 1.9; }
        .post-content h1,.post-content h2,.post-content h3 { margin-top: 1.5rem; font-weight: 700; }
        .post-content blockquote { border-left: 4px solid var(--brand); padding-left: 16px; color: #777; margin: 16px 0; }
        .post-content pre { background: #282c34; color: #abb2bf; border-radius: 8px; padding: 16px; font-size: .88rem; overflow-x: auto; }
        .post-content img { max-width: 100%; border-radius: 8px; }

        /* ── 댓글 ── */
        .comment-wrap  { background: #fff; border-radius: 10px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
        .comment-item  { padding: 14px 0; border-bottom: 1px solid #f3f3f3; }
        .comment-item:last-child { border-bottom: none; }
        .comment-author { font-weight: 600; font-size: .9rem; }
        .comment-date   { font-size: .78rem; color: #bbb; margin-left: 8px; }
        .comment-text   { font-size: .9rem; color: #444; margin-top: 6px; line-height: 1.7; }
        .comment-reply  { margin-left: 28px; background: #fafafa; border-radius: 8px; padding: 10px 14px; margin-top: 8px; }
        .reply-btn      { font-size: .78rem; color: #aaa; cursor: pointer; margin-top: 4px; }
        .reply-btn:hover { color: var(--brand); }
        .comment-form textarea { border-radius: 8px; border: 1px solid #e0e0e0; font-size: .9rem; }
        .comment-form textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(255,102,0,.1); }
        .btn-comment { background: var(--brand); color: #fff; border: none; border-radius: 8px; padding: 8px 20px; }
        .btn-comment:hover { background: var(--brand-dark); color: #fff; }

        /* ── 글쓰기 ── */
        .write-wrap  { max-width: 860px; margin: 32px auto; background: #fff; border-radius: 12px; padding: 36px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
        .write-title { border: none; border-bottom: 2px solid #eee; border-radius: 0; font-size: 1.6rem; font-weight: 700; padding: 8px 0; margin-bottom: 16px; }
        .write-title:focus { border-color: var(--brand); box-shadow: none; }
        #editor      { height: 460px; background: #fff; }
        .ql-toolbar  { border-radius: 8px 8px 0 0; border-color: #e0e0e0 !important; }
        .ql-container { border-radius: 0 0 8px 8px; border-color: #e0e0e0 !important; font-size: 1rem; }

        /* ── 로그인 ── */
        .auth-card { max-width: 420px; margin: 80px auto; background: #fff; border-radius: 14px; padding: 40px; box-shadow: 0 4px 24px rgba(0,0,0,.1); }
        .auth-card h2 { font-weight: 800; text-align: center; margin-bottom: 28px; }
        .auth-card .form-control:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(255,102,0,.1); }
        .btn-brand  { background: var(--brand); color: #fff; border: none; border-radius: 8px; width: 100%; padding: 11px; font-weight: 600; }
        .btn-brand:hover { background: var(--brand-dark); color: #fff; }
    </style>
</head>

<!-- 네비게이션 fragment -->
<nav th:fragment="nav" class="blog-nav">
    <div class="container-fluid px-4 d-flex align-items-center justify-content-between" style="height:54px;">
        <a class="brand" th:href="@{/}" th:text="'iptablecommandcode | ' + ${@environment.getProperty('project.level')} + ' SERVER'">iptablecommandcode</a>
        <div class="d-flex align-items-center gap-3">
            <a class="nav-link" th:href="@{/board/boardList}">포스트</a>
            <th:block th:if="${session.loginUser == null}">
                <a class="nav-link" th:href="@{/sign/signIn}">로그인</a>
                <a class="nav-link" th:href="@{/sign/signUp}">회원가입</a>
            </th:block>
            <th:block th:if="${session.loginUser != null}">
                <a class="btn-write" th:href="@{/board/boardWrite}">✏ 글쓰기</a>
                <th:block th:if="${session.loginUser.admin == 'Y'}">
                    <a class="nav-link" th:href="@{/admin/dashboard}">⚙ 관리</a>
                </th:block>
                <a class="nav-link" th:href="@{/sign/signOut}">로그아웃</a>
            </th:block>
        </div>
    </div>
</nav>

<!-- 사이드바 fragment -->
<aside th:fragment="sidebar" class="blog-side">
    <!-- 카테고리 -->
    <div class="side-section">
        <div class="side-title">카테고리</div>
        <a class="side-cat-item" th:href="@{/board/boardList}">
            <span>전체</span>
        </a>
        <a class="side-cat-item"
           th:each="cat : ${categories}"
           th:href="@{/board/boardList(categorySq=${cat.categorySq})}">
            <span th:text="${cat.categoryName}">카테고리</span>
        </a>
    </div>
    <!-- 태그 클라우드 -->
    <div class="side-section">
        <div class="side-title">태그</div>
        <div class="tag-cloud">
            <a th:each="tag : ${allTags}"
               th:href="@{/board/boardList(tagSq=${tag.tagSq})}"
               th:text="'#' + ${tag.tagName}">태그</a>
        </div>
    </div>
</aside>
</html>

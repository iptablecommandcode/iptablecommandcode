<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('홈')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div class="blog-wrap">
    <main class="blog-main">
        <!-- 히어로 배너 -->
        <div style="background:linear-gradient(135deg,#0d6efd 0%,#0a58ca 100%);border-radius:14px;padding:40px 36px;color:#fff;margin-bottom:28px;">
            <div style="font-size:1.05rem;opacity:.85;margin-bottom:6px;">공부하고 기록하고 성장하는</div>
            <div style="font-size:2rem;font-weight:800;margin-bottom:12px;">iptablecommandcode</div>
            <a th:href="@{/board/boardList}" style="background:rgba(255,255,255,.2);color:#fff;border:1.5px solid rgba(255,255,255,.5);border-radius:20px;padding:7px 20px;text-decoration:none;font-size:.9rem;">포스트 보기 →</a>
        </div>

        <!-- 최근 포스트 -->
        <div style="font-size:1rem;font-weight:700;color:#222;margin-bottom:14px;">최근 포스트</div>
        <th:block th:each="board : ${recentBoards}">
            <div class="post-card">
                <div class="post-card-thumb-placeholder" th:if="${board.thumbnailUrl == null}">📄</div>
                <img class="post-card-thumb" th:if="${board.thumbnailUrl != null}" th:src="${board.thumbnailUrl}" alt="썸네일">
                <div class="post-card-body">
                    <div class="post-card-cat" th:text="${board.categoryName ?: '미분류'}"></div>
                    <a class="post-card-title" th:href="@{/board/boardDetail(boardSq=${board.boardSq})}">
                        <span th:if="${board.noticeYn == 'Y'}" class="badge-notice">공지</span>
                        <span th:text="${board.title}"></span>
                    </a>
                    <div class="post-card-summary" th:text="${board.summary}"></div>
                    <div class="post-card-meta">
                        <span th:text="${board.username}"></span>
                        <span th:text="${#temporals.format(board.createDate,'yyyy.MM.dd')}"></span>
                        <span>👁 <span th:text="${board.viewCount}"></span></span>
                    </div>
                </div>
            </div>
        </th:block>
        <div th:if="${#lists.isEmpty(recentBoards)}" style="text-align:center;padding:60px;color:#aaa;">아직 작성된 포스트가 없습니다.</div>
        <div class="text-center mt-2">
            <a th:href="@{/board/boardList}" style="color:#0d6efd;font-size:.9rem;text-decoration:none;">전체 포스트 보기 →</a>
        </div>
    </main>
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('관리자 대시보드')}"></head>
<body>
<th:block th:replace="~{fragments/adminLayout :: adminStyles}"></th:block>
<div class="adm-wrap">
    <nav th:replace="~{fragments/adminLayout :: adminNav('dashboard')}"></nav>
    <main class="adm-main">
        <div class="adm-header"><h4>대시보드</h4></div>

        <div class="stat-grid">
            <div class="stat-box">
                <div class="stat-label">전체 게시글</div>
                <div class="stat-value primary" th:text="${totalBoards}">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">전체 회원</div>
                <div class="stat-value" th:text="${totalUsers}">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">전체 댓글</div>
                <div class="stat-value" th:text="${totalComments}">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">카테고리</div>
                <div class="stat-value" th:text="${totalCategories}">0</div>
            </div>
        </div>

        <div style="font-weight:700;font-size:.95rem;margin-bottom:12px;">최근 게시글</div>
        <table class="adm-table">
            <thead><tr><th>번호</th><th>카테고리</th><th>제목</th><th>작성자</th><th>조회</th><th>공지</th><th>작성일</th></tr></thead>
            <tbody>
                <tr th:each="b : ${recentBoards}">
                    <td th:text="${b.boardSq}"></td>
                    <td><span class="badge-cat" th:text="${b.categoryName ?: '미분류'}"></span></td>
                    <td><a th:href="@{/board/boardDetail(boardSq=${b.boardSq})}" th:text="${b.title}" style="color:#333;text-decoration:none;"></a></td>
                    <td th:text="${b.username}"></td>
                    <td th:text="${b.viewCount}"></td>
                    <td><span th:classappend="${b.noticeYn == 'Y'} ? 'badge-on' : 'badge-off'" th:text="${b.noticeYn}"></span></td>
                    <td th:text="${#temporals.format(b.createDate,'yyyy-MM-dd')}"></td>
                </tr>
            </tbody>
        </table>
    </main>
</div>
</body>
</html>
